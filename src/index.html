if(p.alergias)f.push(['Alergia','bg-red-600']);const lv=(p.vs||[]).slice(-1)[0],nw=lv?news(lv):null;if(nw&&nw.t>=5)f.push(['NEWS2 '+nw.t,nw.t>=7?'bg-red-600':'bg-orange-600']);const od=(p.tasks||[]).filter(t=>t.due<Date.now()).length;if(od)f.push(['Tareas '+od,'bg-rose-600']);if(allergyHits(p).length)f.push(['Fárm./alergia','bg-red-700']);return f};

const devLines=p=>p.dev.map(x=>{const n=days(x.f),i=DEV[x.t]||{lim:99,msg:''};return `${x.t}${x.d?' ('+x.d+')':''}, instalado ${x.f.split('-').reverse().join('/')}, dia ${n+1}${n>=i.lim?' - ALERTA: '+i.msg:''}`});

const SL=[7,9,11,13,15,17,19,21,23,1,3,5],ORD=[...Array(24)].map((_,i)=>(i+7)%24);
const FR=[[24,'c/24 h'],[12,'c/12 h'],[8,'c/8 h'],[6,'c/6 h'],[4,'c/4 h'],[0,'SOS / continuo']];
const hh=h=>String(h).padStart(2,'0')+':00';
const isLock=m=>m.lock!==''&&m.lock!==undefined&&m.lock!==null;
const hrsOf=(s,fr)=>fr?Array.from({length:24/fr},(_,i)=>(s+i*fr)%24):[];
const plan=ms=>{const load=Array(24).fill(0),hr={};
ms.filter(m=>m.fr&&isLock(m)).forEach(m=>{const h=hrsOf(Number(m.lock),m.fr);hr[m.id]=h;h.forEach(x=>load[x]++)});
ms.filter(m=>m.fr&&!isLock(m)).sort((a,b)=>a.fr-b.fr).forEach(m=>{let best=null,bc=1e9;SL.forEach(s=>{const h=hrsOf(s,m.fr);const c=Math.max(...h.map(x=>load[x]))*1000+h.reduce((a,x)=>a+load[x],0);if(c<bc){bc=c;best=h}});hr[m.id]=best;best.forEach(x=>load[x]++)});
Object.keys(hr).forEach(k=>{hr[k]=[...hr[k]].sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b))});return{hr,load}};
const farm=p=>{const ms=p.meds||[],{hr}=plan(ms),o=[`HORARIO DE FARMACOS - Cama ${p.bed||'-'} (${p.ini||'-'})`,'Dosis distribuidas en horas impares para repartir la carga.'];

{ms.map(m=><div key={m.id} className="rounded-lg border border-slate-200 dark:border-slate-700 px-3 py-2 text-sm flex flex-wrap items-center gap-2">

<div className="flex flex-wrap gap-1 mt-1">{m.fr?(hr[m.id]||[]).map(h=><span key={h} className={'px-1.5 rounded text-xs '+(isLock(m)?'bg-amber-200 dark:bg-amber-800':'bg-teal-100 dark:bg-teal-900')}>{hh(h)}</span>):<span className="text-xs text-slate-500">Sin horario fijo</span>}</div></div>

<button aria-label="Quitar" onClick={()=>up({meds:ms.filter(x=>x.id!==m.id)})}><Ic d={P.trash}/></button></div>)}

<div className="flex items-end gap-0.5">{ORD.map(h=><div key={h} className="flex-1 flex flex-col items-center justify-end"><span className="text-[10px] h-3">{load[h]||''}</span><div style={{height:(load[h]/mx*56)+'px'}} className={'w-full rounded-t '+(h%2?'bg-teal-600':'bg-amber-500')}/><span className="text-[10px] text-slate-500">{h}</span></div>)}</div>
<p className="text-xs text-slate-500 mt-1">Barras verdes: horas impares. Naranjas: horas pares (solo por hora fijada manualmente).</p></div>}</Card>}

const useNow=(ms=30000)=>{const [n,setN]=useState(Date.now());useEffect(()=>{const i=setInterval(()=>setN(Date.now()),ms);return()=>clearInterval(i)},[]);return n};
const nextOdd=()=>{const d=new Date();d.setMinutes(0,0,0);d.setHours(d.getHours()+1);if(d.getHours()%2===0)d.setHours(d.getHours()+1);return d.getTime()};
const hm=ms=>new Date(ms).toTimeString().slice(0,5);
const norm=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const FAM={penicilina:['penicilina','amoxicilina','ampicilina','piperacilina','cloxacilina','augmentin','clavulan'],aine:['aine','ketoprofeno','ibuprofeno','diclofenaco','ketorolaco','naproxeno','aspirina','acetilsalicilico'],sulfa:['sulfa','cotrimoxazol','trimetoprim'],dipirona:['dipirona','metamizol'],opioide:['opioide','morfina','tramadol','codeina','fentanilo','petidina'],macrolido:['macrolido','azitromicina','claritromicina','eritromicina'],quinolona:['quinolona','ciprofloxacino','levofloxacino'],cefalosporina:['cefalosporina','ceftriaxona','cefazolina','cefuroxima','cefepime','ceftazidima','cefotaxima']};
const allergyHits=p=>{const a=norm(p.alergias);if(!a)return[];const out=[];(p.meds||[]).forEach(m=>{const n=norm(m.n);Object.keys(FAM).forEach(k=>{if((a.includes(k)||FAM[k].some(t=>a.includes(t)))&&FAM[k].some(t=>n.includes(t))&&!out.some(o=>o.m===m.n))out.push({m:m.n,w:'alergia registrada ('+p.alergias+'), familia '+k})});if(/penicil|amoxi|ampi/.test(a)&&/cef/.test(n)&&!out.some(o=>o.m===m.n))out.push({m:m.n,w:'posible reactividad cruzada con penicilinas (confirmar)'});a.split(/[^a-z]+/).filter(w=>w.length>4).forEach(w=>{if(n.includes(w)&&!out.some(o=>o.m===m.n))out.push({m:m.n,w:'coincide con alergia registrada ('+p.alergias+')'})})});return out};
const news=v=>{const n=x=>x===''||x===undefined||isNaN(Number(x))?null:Number(x);const sc=(x,r)=>x===null?0:(r.find(([lo,hi])=>x>=lo&&x<=hi)||[0,0,0])[2];
const parts={FR:sc(n(v.fr),[[-1e9,8,3],[9,11,1],[12,20,0],[21,24,2],[25,1e9,3]]),SpO2:sc(n(v.sat),[[-1e9,91,3],[92,93,2],[94,95,1],[96,1e9,0]]),O2:v.o2?2:0,PAS:sc(n(v.pas),[[-1e9,90,3],[91,100,2],[101,110,1],[111,219,0],[220,1e9,3]]),FC:sc(n(v.fc),[[-1e9,40,3],[41,50,1],[51,90,0],[91,110,1],[111,130,2],[131,1e9,3]]),Conciencia:v.av&&v.av!=='A'?3:0,T:sc(n(v.tp),[[-1e9,35,3],[35.0001,36,1],[36.0001,38,0],[38.0001,39,1],[39.0001,1e9,2]])};
const t=Object.values(parts).reduce((a,b)=>a+b,0),any3=Object.values(parts).includes(3);
const lvl=t>=7?['ALTO (respuesta de emergencia)','#dc2626']:t>=5?['MEDIO (valoración urgente por médico)','#ea580c']:any3?['BAJO-MEDIO (un parámetro en 3: revisión urgente)','#eab308']:['BAJO','#16a34a'];
return{t,parts,lvl:lvl[0],col:lvl[1]}};
const lastVS=p=>(p.vs||[]).slice(-1)[0]||null;
const vsTxt=p=>{const v=lastVS(p);if(!v)return '';const r=news(v);return `SV ${v.t}: PA ${v.pas||'-'}/${v.pad||'-'}, FC ${v.fc||'-'}, FR ${v.fr||'-'}, SatO2 ${v.sat||'-'}%, T ${v.tp||'-'} C${v.gl?', HGT '+v.gl:''}; NEWS2 ${r.t} (${r.lvl})`};
const bhSum=p=>{const b=p.bh||{e:[]},e=b.e||[],s=k=>e.filter(x=>x.k===k).reduce((a,x)=>a+Number(x.ml||0),0),diu=e.filter(x=>x.tp==='Diuresis').reduce((a,x)=>a+Number(x.ml||0),0),ing=s('ing'),egr=s('egr');return{ing,egr,bal:ing-egr,diu,dk:b.peso&&b.hrs&&diu?diu/(Number(b.peso)*Number(b.hrs)):null}};
const bhTxt=p=>{const r=bhSum(p);if(!r.ing&&!r.egr)return '';return `Balance hidrico: ingresos ${r.ing} mL, egresos ${r.egr} mL, balance ${r.bal>0?'+':''}${r.bal} mL${r.dk!==null?', diuresis '+r.dk.toFixed(2)+' mL/kg/h'+(r.dk<0.5?' (OLIGURIA)':''):''}`};
const extraLines=p=>[vsTxt(p),bhTxt(p),p.cud&&p.cud.r&&p.cud.d?`Categorizacion CUDYR: ${p.cud.r}${p.cud.d}`:'',...allergyHits(p).map(a=>`ALERTA ALERGIA: ${a.m} (${a.w})`),rondaTxt(p),procTxt(p),cambios(p).length?'Cambios vs turno anterior: '+cambios(p).join('; '):''].filter(Boolean).map(x=>'- '+x);
const EV={ingreso:{n:'Ingreso',f:['Procedencia (urgencia, pabellón, domicilio)','Motivo de ingreso','Observaciones']},traslado:{n:'Traslado',f:['Destino','Motivo del traslado','Receptor o acompañante']},alta:{n:'Alta',f:['Tipo de alta (domicilio, otro centro)','Indicaciones entregadas','Observaciones']},caida:{n:'Caída',f:['Lugar y circunstancia','Lesiones observadas','Aviso a médico y conducta']},reaccion:{n:'Reacción adversa',f:['Fármaco o agente sospechoso','Manifestaciones','Conducta realizada']}};
const evento=p=>{const e=p.ev||{},T=EV[e.t];if(!T)return 'Selecciona un tipo de evento en el formulario (tarjeta Nota por evento).';const h=e.h||hm(Date.now()),sx=p.sexo==='F'?'femenina':p.sexo==='M'?'masculino':'',a=e.a||'-',b=e.b||'-',c=e.c||'-';
const id=`${h} hrs. Paciente ${sx} de ${p.edad||'-'} anos, iniciales ${p.ini||'-'}, cama ${p.bed||'-'}, dx ${p.dx||'-'}. Alergias: ${p.alergias||'no conocidas'}. Aislamiento: ${p.aisl}.`;
const dev=p.dev.length?` Dispositivos: ${devLines(p).join('; ')}.`:'',sv=vsTxt(p)?' '+vsTxt(p)+'.':'',esc=scLines(p).length?' '+scLines(p).join('; ')+'.':'';
const X={ingreso:`NOTA DE INGRESO DE ENFERMERIA\n${id} Ingresa desde ${a} por ${b}. Se identifica con brazalete y se orienta sobre normas de la unidad. Estado general: ${p.estado||'-'}.${dev}${sv}${esc} Se informa a medico de ingreso. ${c}`,
traslado:`NOTA DE TRASLADO\n${id} Se traslada a ${a} por ${b}. Estado general: ${p.estado||'-'}.${dev}${sv} Se realiza entrega por ISBAR a ${c}. Pendientes: ${p.pend.join('; ')||'sin pendientes criticos'}.`,
alta:`NOTA DE ALTA DE ENFERMERIA\n${id} Se da de alta a ${a}. Indicaciones y educacion entregadas: ${b}. Se retiran dispositivos segun norma.${sv} ${c}`,
caida:`NOTA DE EVENTO: CAIDA\n${id} Presenta caida: ${a}. Lesiones: ${b}.${sv}${esc} Se evalua estado neurologico, se avisa a medico y se registra conducta: ${c}. Se notifica evento adverso segun protocolo y se revalora riesgo de caida.`,
reaccion:`NOTA DE EVENTO: REACCION ADVERSA\n${id} Posible reaccion adversa a ${a}: ${b}.${sv} Conducta: ${c}. Se informa a medico y se notifica a farmacovigilancia.`};return clean(X[e.t])};

function VS({p,up}){const [nd,setNd]=useDraft(p,up,'vs',{pas:'',pad:'',fc:'',fr:'',sat:'',tp:'',av:'A',gl:''});const vs=p.vs||[],lv=lastVS(p),r=lv?news(lv):null;

const add=()=>{const o2=!!(p.o2&&p.o2.s&&p.o2.s!=='Ambiental');up({vs:[...vs,{...nd,o2,id:Math.random().toString(36).slice(2),t:hm(Date.now())}].slice(-12)});setNd({...nd,pas:'',pad:'',fc:'',fr:'',sat:'',tp:'',gl:''})};
const AV={A:'Alerta',C:'Confusión nueva',V:'Voz',P:'Dolor',U:'Sin respuesta'};
return <Card t="Signos vitales y alerta temprana (NEWS2)">

{r&&<div className="rounded-lg px-3 py-2 text-white text-sm font-medium" style={{background:r.col}}>NEWS2 {r.t}: {r.lvl}<div className="text-xs font-normal">{Object.entries(r.parts).filter(([,x])=>x).map(([k,x])=>k+' '+x).join(', ')||'Sin puntos'}</div></div>}
<Trend vs={vs}/>
{vs.slice(-5).reverse().map(v=>{const q=news(v);return <div key={v.id} className="flex items-center gap-2 text-xs border-b border-slate-200 dark:border-slate-800 pb-1"><span className="font-semibold">{v.t}</span><span className="flex-1">PA {v.pas}/{v.pad} FC {v.fc} FR {v.fr} Sat {v.sat}% T {v.tp}{v.gl?' HGT '+v.gl:''}</span><span className="px-1.5 rounded text-white" style={{background:q.col}}>{q.t}</span><button aria-label="Quitar" onClick={()=>up({vs:vs.filter(x=>x.id!==v.id)})}><Ic d={P.trash} c="w-3.5 h-3.5"/></button></div>})}</Card>}

<div className="flex flex-wrap gap-1.5">{e.map((x,i)=><span key={i} className={'text-xs rounded-full px-2 py-0.5 flex items-center gap-1 '+(x.k==='ing'?'bg-sky-100 dark:bg-sky-900':'bg-amber-100 dark:bg-amber-900')}>{x.tp} {x.ml} mL<button aria-label="Quitar" onClick={()=>set({e:e.filter((_,j)=>j!==i)})}>x</button></span>)}</div>
<div className="rounded-lg bg-slate-100 dark:bg-slate-800 px-3 py-2 text-sm">Ingresos {r.ing} mL, egresos {r.egr} mL, balance <b>{r.bal>0?'+':''}{r.bal} mL</b>{r.dk!==null&&<div className={r.dk<0.5?'text-red-600 font-semibold':''}>Diuresis {r.dk.toFixed(2).replace('.',',')} mL/kg/h{r.dk<0.5?' - oliguria (menor a 0,5): avisar a médico':''}</div>}</div></Card>}

function Tasks({p,up}){const now=useNow(),all=p.tasks||[],ts=[...all].sort((a,b)=>a.due-b.due);const [nd,setNd]=useDraft(p,up,'task',{n:'',ev:0,t:''});

<div className="grid grid-cols-2 sm:grid-cols-4 gap-2 items-end"><div className="col-span-2"><L t="Otra tarea"><In value={nd.n} onChange={e=>setNd({...nd,n:e.target.value})}/></L></div>

{ts.map(t=>{const d=t.due-now,st=d<0?'bg-red-100 dark:bg-red-950 border-red-400':d<18e5?'bg-amber-100 dark:bg-amber-950 border-amber-400':'border-slate-200 dark:border-slate-700';return <div key={t.id} className={'flex items-center gap-2 rounded-lg border px-3 py-2 text-sm '+st}><span className="font-semibold tabular-nums">{hm(t.due)}</span><span className="flex-1">{t.n}{t.ev?' (c/'+t.ev+' h)':''}{d<0&&<b className="text-red-600"> vencida</b>}{d>=0&&d<18e5&&<b className="text-amber-700 dark:text-amber-300"> próxima</b>}</span><button onClick={()=>done(t)} className="rounded bg-teal-700 text-white text-xs px-2 py-1">Hecha</button><button aria-label="Quitar" onClick={()=>up({tasks:all.filter(x=>x.id!==t.id)})}><Ic d={P.trash}/></button></div>})}</Card>}

function Evento({p,up,sm}){const e=p.ev||{},T=EV[e.t],K=['a','b','c'];
return <Card t="Nota por evento"><Chips o={Object.keys(EV)} v={e.t||''} lab={x=>EV[x].n} on={x=>{up({ev:{...e,t:x}});if(x)sm('evt')}}/>
{T&&<div className="space-y-2"><L t="Hora"><In type="time" value={e.h||''} onChange={x=>up({ev:{...e,h:x.target.value}})}/></L>{T.f.map((l,i)=><L key={l} t={l}><In value={e[K[i]]||''} onChange={x=>up({ev:{...e,[K[i]]:x.target.value}})}/></L>)}<p className="text-xs text-slate-500">La nota aparece en la pestaña Evento de la vista previa.</p></div>}</Card>}

function Board({pts,open,copy,copied,sh,list}){const now=useNow(),[hs,setH]=useState(null);
const {load,by}=useMemo(()=>{const load=Array(24).fill(0),by={};pts.forEach(p=>{const ms=p.meds||[],r=plan(ms);r.load.forEach((n,h)=>{load[h]+=n});ms.forEach(m=>(r.hr[m.id]||[]).forEach(h=>{(by[h]=by[h]||[]).push((p.bed||'-')+': '+m.n)}))});return{load,by}},[pts]);
const mx=Math.max(1,...load),peak=ORD.find(h=>load[h]===mx);
const info=pts.map(p=>{const v=lastVS(p);return{p,r:v?news(v):null,fl:flags(p),dv:p.dev.filter(d=>days(d.f)>=(DEV[d.t]||{lim:99}).lim).length,od:(p.tasks||[]).filter(t=>t.due<now).length,al:allergyHits(p).length}});
const cnt=f=>info.filter(f).length,cud={};pts.forEach(p=>{const c=p.cud;if(c&&c.r&&c.d)cud[c.r+c.d]=(cud[c.r+c.d]||0)+1});
const st=[['Pacientes',pts.length],['NEWS2 5 o más',cnt(i=>i.r&&i.r.t>=5)],['Aislamiento',cnt(i=>i.p.aisl!=='Estandar')],['Dispositivos por revisar',cnt(i=>i.dv)],['Tareas vencidas',info.reduce((a,i)=>a+i.od,0)],['Alerta alergia',cnt(i=>i.al)],['Con cambios',cnt(i=>cambios(i.p).length)]];
const EC={Estable:'bg-green-600','De cuidado':'bg-amber-500',Grave:'bg-orange-600',Critico:'bg-red-600'};
return <div className="space-y-4">
<div className="grid grid-cols-2 sm:grid-cols-7 gap-2">{st.map(([l,n])=><div key={l} className="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3"><div className="text-2xl font-bold text-teal-800 dark:text-teal-400">{n}</div><div className="text-xs text-slate-500">{l}</div></div>)}</div>
{Object.keys(cud).length>0&&<p className="text-sm">CUDYR: {Object.keys(cud).sort().map(k=>k+' x'+cud[k]).join(', ')}</p>}
<button onClick={()=>copy(turnoTxt(pts,sh),'turno')} className="w-full py-3 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold flex items-center justify-center gap-2"><Ic c="w-5 h-5" d={copied==='turno'?P.ok:P.copy}/>{copied==='turno'?'Copiado':'Copiar entrega de todo el turno ('+pts.length+' pacientes)'}</button>
<div className="grid grid-cols-2 gap-2"><button onClick={()=>exp('pdf',turnoTxt(pts,sh),'entrega-turno')} className="py-2 rounded-lg border border-slate-400 text-sm">Descargar PDF del turno</button><button onClick={()=>exp('docx',turnoTxt(pts,sh),'entrega-turno')} className="py-2 rounded-lg border border-slate-400 text-sm">Descargar Word del turno</button></div>
<Card t="Carga de fármacos de todo el turno">
<div className="text-sm">{load.some(x=>x)?'Máximo simultáneo: '+mx+' dosis a las '+hh(peak)+'. Toca una hora para ver el detalle.':'Aún no hay fármacos registrados.'}</div>
<div className="flex items-end gap-0.5">{ORD.map(h=><button key={h} onClick={()=>setH(hs===h?null:h)} className="flex-1 flex flex-col items-center justify-end"><span className="text-[10px] h-3">{load[h]||''}</span><div style={{height:(load[h]/mx*64)+'px'}} className={'w-full rounded-t '+(hs===h?'bg-slate-800 dark:bg-slate-200':h%2?'bg-teal-600':'bg-amber-500')}/><span className="text-[10px] text-slate-500">{h}</span></button>)}</div>
{hs!==null&&<div className="text-sm rounded-lg bg-slate-100 dark:bg-slate-800 p-3"><b>{hh(hs)}</b>: {(by[hs]||[]).join('; ')||'sin dosis'}</div>}</Card>
<div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2">{list.map(l=>info.find(i=>i.p.id===l.id)).filter(Boolean).map(({p,r,fl,dv,od})=><button key={p.id} onClick={()=>open(p.id)} className="text-left rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 space-y-1 hover:border-teal-600">
<div className="flex items-center gap-2"><b>{p.bed||'Cama'}</b><span className="text-sm">{p.ini} {p.edad}{p.sexo}</span>{p.estado&&<span className={'ml-auto text-[10px] px-1.5 rounded text-white '+(EC[p.estado]||'bg-slate-500')}>{p.estado}</span>}</div>
<div className="text-xs text-slate-500 line-clamp-2">{p.dx||'Sin diagnóstico'}</div>
<div className="flex flex-wrap gap-1">{r&&<span className="text-[10px] px-1.5 rounded text-white" style={{background:r.col}}>NEWS2 {r.t}</span>}{fl.filter(f=>!f[0].startsWith('NEWS2')).map(([t,c])=><span key={t} className={'text-[10px] px-1.5 rounded text-white '+c}>{t}</span>)}{dv>0&&<span className="text-[10px] px-1.5 rounded text-white bg-red-500">Disp. {dv}</span>}{p.next&&<span className="text-[10px] px-1.5 rounded bg-yellow-300 text-black">Nota turno</span>}{p.cud&&p.cud.r&&p.cud.d&&<span className="text-[10px] px-1.5 rounded bg-slate-200 dark:bg-slate-700">{p.cud.r}{p.cud.d}</span>}</div></button>)}</div></div>}

const fmt=x=>isFinite(x)?String(Math.round(x*100)/100).replace('.',','):'-';
function Calc(){const [t,setT]=useState('vol'),[v,setV]=useState({fac:'20'});const n=k=>parseFloat(String(v[k]||'').replace(',','.'));
const I=(k,l)=><L key={k} t={l}><In inputMode="decimal" value={v[k]||''} onChange={e=>setV({...v,[k]:e.target.value})}/></L>;
const R=(l,x,u)=><div key={l} className="rounded-lg bg-teal-50 dark:bg-teal-950 text-teal-900 dark:text-teal-200 px-3 py-2 text-sm"><b>{l}:</b> {fmt(x)} {u}</div>;
const mlh=n('vol')/n('hrs'),conc=n('mg')*1000/n('dil'),pe=n('peso');
return <Card t="Calculadoras de infusión y dosis">
<div className="flex flex-wrap gap-1.5">{[['vol','Volumen y goteo'],['mcg','mcg/kg/min'],['mgkg','mg/kg']].map(([k,l])=><button key={k} onClick={()=>setT(k)} className={'px-2.5 py-1 rounded-lg text-sm border '+(t===k?'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900':'border-slate-300 dark:border-slate-600')}>{l}</button>)}</div>
{t==='vol'&&<div className="space-y-2"><div className="grid grid-cols-2 gap-2">{I('vol','Volumen (mL)')}{I('hrs','Tiempo (horas)')}</div><Chips o={['20','60']} v={v.fac} lab={x=>x==='20'?'Macrogoteo 20 gotas/mL':'Microgoteo 60 gotas/mL'} on={x=>setV({...v,fac:x||'20'})}/>{v.vol&&v.hrs&&[R('Velocidad',mlh,'mL/h'),R('Goteo',mlh*n('fac')/60,'gotas/min')]}</div>}
{t==='mcg'&&<div className="space-y-2"><div className="grid grid-cols-2 gap-2">{I('peso','Peso (kg)')}{I('mg','Fármaco en la bolsa (mg)')}{I('dil','Volumen total (mL)')}{I('dosis','Dosis indicada (mcg/kg/min)')}{I('rate','Velocidad actual (mL/h)')}</div>{v.mg&&v.dil&&R('Concentración',conc,'mcg/mL')}{v.dosis&&v.peso&&v.mg&&v.dil&&R('Velocidad para esa dosis',n('dosis')*pe*60/conc,'mL/h')}{v.rate&&v.peso&&v.mg&&v.dil&&R('Dosis con la velocidad actual',n('rate')*conc/(pe*60),'mcg/kg/min')}</div>}
{t==='mgkg'&&<div className="space-y-2"><div className="grid grid-cols-2 gap-2">{I('dk','Dosis (mg/kg)')}{I('p2','Peso (kg)')}{I('cmg','Concentración (mg/mL), opcional')}</div>{v.dk&&v.p2&&R('Dosis total',n('dk')*n('p2'),'mg')}{v.dk&&v.p2&&v.cmg&&R('Volumen a administrar',n('dk')*n('p2')/n('cmg'),'mL')}</div>}
<p className="text-xs text-slate-500">Apoyo de cálculo: verifica siempre con doble chequeo y la indicación médica.</p></Card>}

const H=async x=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tpe:'+x));return Array.from(new Uint8Array(b)).map(y=>y.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+x}};
const THEMES=[{id:'clinico',name:'Clínico (teal)',sw:'#0f766e'},{id:'sereno',name:'Sereno (azul)',sw:'#2563eb'},{id:'calido',name:'Cálido (ámbar)',sw:'#b45309'},{id:'grafito',name:'Grafito (alto contraste)',sw:'#1e293b'}];
let ENC_BLOB=null;

const d=vs.map(v=>TS[k](v)),ok=d.filter(x=>!isNaN(x)),w=300,h=90,pd=16,mn=Math.min(...ok),mx=Math.max(...ok),rg=mx-mn||1;
const q=d.map((x,i)=>isNaN(x)?null:[pd+i*(w-2*pd)/(d.length-1),h-pd-(x-mn)/rg*(h-2*pd)]);
const path=q.filter(Boolean).map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' ');
return <div className="space-y-1"><div className="text-sm font-medium">Tendencia del turno</div><Chips o={Object.keys(TS)} v={k} on={x=>setK(x||k)}/>
<svg viewBox={'0 0 '+w+' '+h} className="w-full h-24 text-slate-700 dark:text-slate-200"><path d={path} fill="none" stroke="#0f766e" strokeWidth="2"/>{q.map((a,i)=>a&&<g key={i}><circle cx={a[0]} cy={a[1]} r="3" fill="#0f766e"/><text x={a[0]} y={a[1]-6} fontSize="9" textAnchor="middle" fill="currentColor">{d[i]}</text></g>)}</svg>
<div className="flex justify-between text-[10px] text-slate-500"><span>{vs[0].t}</span><span>{vs[vs.length-1].t}</span></div></div>}
const PROC={cup:{n:'Instalación de CUP',s:['Verificar indicación médica y necesidad','Higiene de manos y técnica aséptica','Material estéril completo y calibre adecuado','Higiene genital previa','Instalación con técnica estéril','Inflar balón con agua estéril según fabricante','Fijar sonda y conectar a sistema cerrado','Bolsa bajo el nivel de la vejiga y sin tocar el piso','Registrar fecha, hora, calibre y características de la orina']},
vvp:{n:'Instalación de VVP',s:['Verificar indicación y explicar el procedimiento','Higiene de manos y guantes limpios','Elegir sitio (evitar zonas de flexión)','Antisepsia con clorhexidina alcohólica y dejar secar','Instalar sin tocar el sitio tras la antisepsia','Verificar permeabilidad y ausencia de infiltración','Fijar con apósito transparente estéril','Rotular fecha, hora y calibre','Registrar sitio y fecha']},
cur:{n:'Curación de herida o LPP',s:['Higiene de manos','Preparar campo y material estéril','Retirar apósito previo sin contaminar','Evaluar tamaño, exudado y signos de infección','Limpiar con suero fisiológico según protocolo','Aplicar apósito indicado','Fechar el apósito','Eliminar residuos según norma','Registrar características y fecha de la próxima curación']},
sng:{n:'Instalación de SNG',s:['Verificar indicación médica','Medir longitud (nariz, lóbulo, apéndice xifoides)','Higiene de manos y guantes','Instalar con el paciente semisentado','Confirmar posición según protocolo','Fijar y marcar la longitud','Cabecera elevada 30-45 grados','Registrar fecha, calibre y posición']}};
const procTxt=p=>{const r=(p.procs||[]).slice(-1)[0];return r?`Procedimiento ${r.n} ${hm(r.t)}: ${r.ok}/${r.tot} pasos${r.falta.length?'; falta: '+r.falta.join(', '):''}`:''};
const procS=p=>{const r=(p.procs||[]).slice(-1)[0];return r?`Proc ${r.n} ${hm(r.t)} ${r.ok}/${r.tot}`:''};
function Proc({p,up}){const pr=p.pr||{t:'',ok:[]},T=PROC[pr.t],ps=p.procs||[];
const reg=()=>up({procs:[...ps,{t:Date.now(),n:T.n,ok:pr.ok.length,tot:T.s.length,falta:T.s.filter(x=>!pr.ok.includes(x))}].slice(-12),pr:{t:'',ok:[]}});
return <Card t="Procedimientos (lista de verificación)"><Chips o={Object.keys(PROC)} v={pr.t} lab={x=>PROC[x].n} on={x=>up({pr:{t:x,ok:[]}})}/>
{T&&<div className="space-y-2"><Chips multi o={T.s} v={pr.ok} on={x=>up({pr:{...pr,ok:x}})}/><div className="flex flex-wrap gap-2"><button onClick={()=>up({pr:{...pr,ok:T.s}})} className="text-sm rounded-lg border border-slate-400 px-3 py-1.5">Marcar todos</button><button onClick={reg} className="text-sm rounded-lg bg-teal-700 text-white px-3 py-1.5">Registrar ({pr.ok.length}/{T.s.length})</button></div></div>}
{ps.slice(-3).reverse().map(r=><div key={r.t} className={'text-xs rounded px-2 py-1 '+(r.falta.length?'bg-amber-100 dark:bg-amber-950':'bg-green-100 dark:bg-green-950')}><b>{hm(r.t)}</b> {r.n}: {r.ok}/{r.tot}{r.falta.length?' - falta: '+r.falta.join(', '):' - completo'}</div>)}
<p className="text-xs text-slate-500">Pasos de referencia: ajústalos al protocolo IAAS de tu establecimiento.</p></Card>}
function Prox({p,up}){return <Card t="Nota para el próximo turno"><textarea rows={2} value={p.next||''} placeholder="Ej: avisar a médico por resultado de Hb; control de glicemia a las 21:00" onChange={e=>up({next:e.target.value})} className="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-2.5 py-1.5 text-sm"/><Mic onText={t=>up({next:(p.next?p.next+' ':'')+t})}/><p className="text-xs text-slate-500">Aparece destacada al final de la entrega de turno.</p></Card>}
const ordPts=(pts,q,ord)=>{const t=norm(q),now=Date.now();let a=pts.filter(p=>!t||norm((p.bed||'')+' '+(p.ini||'')+' '+(p.dx||'')).includes(t));
const k={news:p=>-(lastVS(p)?news(lastVS(p)).t:-1),tareas:p=>-(p.tasks||[]).filter(x=>x.due<now).length,alertas:p=>-flags(p).length};
if(ord==='cama')a=[...a].sort((x,y)=>String(x.bed).localeCompare(String(y.bed),'es',{numeric:true}));else if(k[ord])a=[...a].sort((x,y)=>k[ord](x)-k[ord](y));return a};
function App(){
const [pts,setPts]=useState(load);
const [th,setTh]=useState(()=>{try{return localStorage.getItem(KEY+'_th')||'clinico'}catch(e){return 'clinico'}});useEffect(()=>{document.documentElement.dataset.t=th;try{localStorage.setItem(KEY+'_th',th)}catch(e){}},[th]);
const ready=useRef(!ENC_BLOB),keyRef=useRef(null),saltRef=useRef(null),wr=useRef(Promise.resolve());
const [encOn,setEncOn]=useState(false),[sh,setSh]=useState(false);
const [snd,setSnd]=useState(()=>{try{return localStorage.getItem(KEY+'_snd')==='1'}catch(e){return false}});
const ac=useRef(null),ptsR=useRef(null),seen=useRef(new Set()),sndR=useRef(false);
const [sel,setSel]=useState(pts[0].id),[tab,setTab]=useState('form'),[mode,setMode]=useState('isbar'),[copied,setCopied]=useState(''),[view,setView]=useState('pac'),[q,setQ]=useState(''),[ord,setOrd]=useState('');
const [acc,setAcc]=useState(()=>{try{return{fs:100,hc:false,one:false,...JSON.parse(localStorage.getItem(KEY+'_acc'))}}catch(e){return{fs:100,hc:false,one:false}}});
const [dark,setDark]=useState(()=>{try{return localStorage.getItem(KEY+'_t')==='d'}catch(e){return false}});
const [sec,setSec]=useState(()=>{try{return{pin:'',lock:10,purge:0,...JSON.parse(localStorage.getItem(SK))}}catch(e){return{pin:'',lock:10,purge:0}}});
const [locked,setLocked]=useState(!!sec.pin||!!ENC_BLOB),last=useRef(Date.now());
const [start,setStart]=useState(()=>{try{let x=Number(localStorage.getItem(ST));if(!x){x=Date.now()}return x}catch(e){return Date.now()}});
useEffect(()=>{if(!ready.current)return;const data=pts,key=keyRef.current,salt=saltRef.current;wr.current=wr.current.then(async()=>{try{localStorage.setItem(KEY,key?await encObj(data,key,salt):JSON.stringify(data))}catch(e){}})},[pts,encOn]);
useEffect(()=>{try{localStorage.setItem(ST,String(start))}catch(e){}},[start]);
useEffect(()=>{try{localStorage.setItem(SK,JSON.stringify(sec))}catch(e){}},[sec]);
useEffect(()=>{document.documentElement.style.fontSize=acc.fs+'%';document.documentElement.classList.toggle('hc',!!acc.hc);try{localStorage.setItem(KEY+'_acc',JSON.stringify(acc))}catch(e){}},[acc]);
useEffect(()=>{document.documentElement.classList.toggle('dark',dark);try{localStorage.setItem(KEY+'_t',dark?'d':'l')}catch(e){}},[dark]);
useEffect(()=>{const f=()=>{last.current=Date.now()};['click','keydown','touchstart','scroll'].forEach(e=>window.addEventListener(e,f,true));return()=>['click','keydown','touchstart','scroll'].forEach(e=>window.removeEventListener(e,f,true))},[]);
const purge=all=>{try{localStorage.removeItem(KEY);localStorage.removeItem(OLD);if(all)localStorage.removeItem(SK)}catch(e){};const n=[newP({bed:'1'})];ready.current=true;if(all){ENC_BLOB=null;keyRef.current=null;setEncOn(false);setSec({pin:'',lock:10,purge:0});setLocked(false)}setPts(n);setSel(n[0].id);setView('pac');setStart(Date.now())};
useEffect(()=>{const i=setInterval(()=>{if(sec.pin&&sec.lock&&!locked&&Date.now()-last.current>sec.lock*6e4)setLocked(true);if(sec.purge&&Date.now()-start>sec.purge*36e5)purge(false)},15000);return()=>clearInterval(i)},[sec,locked,start]);
const unlock=async pin=>{if(sec.pin&&await H(pin)!==sec.pin)return false;if(ENC_BLOB&&!keyRef.current){try{const j=JSON.parse(ENC_BLOB),salt=b64d(j.salt),k=await deriveKey(pin,salt),data=(await decObj(ENC_BLOB,k)).map(fix);keyRef.current=k;saltRef.current=salt;ready.current=true;ENC_BLOB=null;setPts(data);setSel(data[0].id);setEncOn(true)}catch(e){return false}}last.current=Date.now();setLocked(false);return true};
const onPin=async pin=>{const h=await H(pin);setSec(x=>({...x,pin:h}));if(window.crypto&&crypto.subtle){const salt=crypto.getRandomValues(new Uint8Array(16));keyRef.current=await deriveKey(pin,salt);saltRef.current=salt;setEncOn(true)}};
const onNoPin=()=>{if(!confirm('Quitar el PIN deja los datos sin cifrar en este dispositivo. Continuar?'))return;setSec(x=>({...x,pin:''}));keyRef.current=null;setEncOn(false)};
const onExport=async()=>{const nm='turnopro-respaldo-'+new Date().toISOString().slice(0,10)+'.json';dlFile(nm,keyRef.current?await encObj({v:2,pts},keyRef.current,saltRef.current):JSON.stringify({v:2,pts}))};
const onImport=fl=>{const r=new FileReader();r.onload=async()=>{try{let j=JSON.parse(r.result);if(j.enc){const pin=prompt('PIN con el que se creó el respaldo');if(!pin)return;j=await decObj(r.result,await deriveKey(pin,b64d(j.salt)))}const a=(j.pts||[]).slice(0,40).map(fix);if(!a.length)throw 0;if(confirm('Se reemplazarán los pacientes actuales por los del respaldo ('+a.length+'). Continuar?'))setPts(a)}catch(x){alert('Archivo de respaldo no válido o PIN incorrecto')}};r.readAsText(fl)};
ptsR.current=pts;sndR.current=snd;
const AC=()=>{try{if(!ac.current){ac.current=new (window.AudioContext||window.webkitAudioContext)()}ac.current.resume()}catch(e){}};
const toggleSnd=()=>{const v=!snd;setSnd(v);try{localStorage.setItem(KEY+'_snd',v?'1':'0')}catch(e){};if(v){AC();if(ac.current)beep(ac.current);try{window.Notification&&Notification.permission==='default'&&Notification.requestPermission()}catch(e){}NT.ask()}};
useEffect(()=>{const f=()=>{if(sndR.current&&!ac.current)AC()};window.addEventListener('click',f,true);return()=>window.removeEventListener('click',f,true)},[]);
useEffect(()=>{const i=setInterval(()=>{const now=Date.now();let n=0;ptsR.current.forEach(pp=>(pp.tasks||[]).forEach(t=>{if(t.due<now){n++;const k=t.id+':'+t.due;if(sndR.current&&!seen.current.has(k)){seen.current.add(k);if(ac.current)beep(ac.current);try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}try{window.Notification&&Notification.permission==='granted'&&new Notification('TurnoPro: tarea vencida',{body:'Cama '+(pp.bed||'-')+': '+t.n})}catch(e){}}}}));document.title=(n?'('+n+') ':'')+'TurnoPro EU'},20000);return()=>clearInterval(i)},[]);
const tsig=JSON.stringify(pts.map(x=>[x.bed,x.tasks]));
useEffect(()=>{if(snd&&ready.current)NT.plan(pts)},[snd,tsig]);
const p=pts.find(x=>x.id===sel)||pts[0];
const up=patch=>setPts(ps=>ps.map(x=>x.id===p.id?{...x,...patch}:x));
const txt=useMemo(()=>sh?(mode==='isbar'?corto(p,0):mode==='evol'?corto(p,1):mode==='farm'?farmS(p):evento(p)):(mode==='isbar'?isbar(p):mode==='evol'?evol(p):mode==='farm'?farm(p):evento(p)),[p,mode,sh]);
const full=sh&&(mode==='isbar'||mode==='evol')?(mode==='isbar'?isbar(p):evol(p)):'';
const nuevoTurno=()=>{if(!confirm('Nuevo turno: se guarda el estado actual para comparar, y se limpian signos vitales, balance, evaluación por sistemas, estado y notas de evento. Continuar?'))return;setPts(ps=>ps.map(x=>({...x,prev:snap(x),vs:[],bh:{...(x.bh||{}),e:[]},sis:{neuro:[],resp:[],cv:[],gi:[],piel:[]},sisT:{},o2:{},estado:'',ev:{},draft:{}})));setStart(Date.now())};
const dup=()=>{if(pts.length>=40)return;const n={...JSON.parse(JSON.stringify(p)),id:Math.random().toString(36).slice(2),bed:'Copia',ini:'',edad:'',sexo:'',dh:'',alergias:'',vs:[],next:'',draft:{},prev:undefined};setPts([...pts,n]);setSel(n.id)};
const add=()=>{if(pts.length>=40)return;const n=newP({bed:'Nueva'});setPts([...pts,n]);setSel(n.id)};
const del=()=>{if(pts.length<2||!confirm('Quitar esta cama?'))return;const r=pts.filter(x=>x.id!==p.id);setPts(r);setSel(r[0].id)};
const copy=async(t,k)=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}setCopied(k);setTimeout(()=>setCopied(''),1800)};
const open=id=>{setSel(id);setView('pac');setTab('form')};
if(locked)return <Lock sec={sec} onTry={unlock} onForgot={()=>purge(true)}/>;
const list=ordPts(pts,q,ord);
const MODES=[['isbar','Entrega ISBAR'],['evol','Nota evolución'],['farm','Horario fármacos'],['evt','Evento']];
const Bar=<div className="flex gap-2"><In placeholder="Buscar cama, iniciales o diagnóstico" value={q} onChange={e=>setQ(e.target.value)}/><select value={ord} onChange={e=>setOrd(e.target.value)} className="rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-2 text-sm">{[['','Orden original'],['cama','Por cama'],['news','Mayor NEWS2'],['tareas','Más tareas vencidas'],['alertas','Más alertas']].map(([v,t])=><option key={v} value={v} className="text-black">{t}</option>)}</select></div>;
return <div className="max-w-7xl mx-auto p-3 sm:p-4 space-y-3" style={{paddingBottom:acc.one?'6rem':undefined}}>
<header className="flex items-center gap-2 flex-wrap">
<h1 className="text-xl font-bold text-teal-800 dark:text-teal-400 mr-auto">TurnoPro EU <span className="font-normal text-slate-500 text-sm">Registros y entrega de turno</span></h1>
{[['pac','Pacientes'],['board','Tablero'],['tools','Herramientas']].map(([k,l])=><button key={k} onClick={()=>setView(k)} className={'px-3 py-2 rounded-lg text-sm border '+(view===k?'bg-teal-700 border-teal-700 text-white':'border-slate-300 dark:border-slate-700')}>{l}</button>)}
<button onClick={nuevoTurno} className="px-3 py-2 rounded-lg text-sm border border-slate-300 dark:border-slate-700">Nuevo turno</button>
<button onClick={toggleSnd} className="px-3 py-2 rounded-lg text-sm border border-slate-300 dark:border-slate-700">Avisos: {snd?'sí':'no'}</button>
{sec.pin&&<button onClick={()=>setLocked(true)} className="px-3 py-2 rounded-lg text-sm border border-slate-300 dark:border-slate-700">Bloquear</button>}
<button onClick={()=>setDark(!dark)} aria-label="Cambiar tema" className="p-2 rounded-lg border border-slate-300 dark:border-slate-700"><Ic d={dark?P.sun:P.moon}/></button>
<button onClick={()=>confirm('Se borraran TODOS los datos de este dispositivo. Continuar?')&&purge(false)} className="px-3 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-semibold">Cerrar Turno y Borrar Todo</button></header>
{view!=='tools'&&Bar}
{view==='board'&&<Board pts={pts} list={list} open={open} copy={copy} copied={copied} sh={sh}/>}
{view==='tools'&&<div className="grid lg:grid-cols-2 gap-4 items-start"><Calc/><Seg sec={sec} setSec={setSec} lockNow={()=>setLocked(true)} start={start} onPin={onPin} onNoPin={onNoPin} enc={encOn} onExport={onExport} onImport={onImport} acc={acc} setAcc={setAcc} th={th} setTh={setTh}/></div>}
{view==='pac'&&<>
<nav className="flex gap-2 flex-wrap max-h-48 overflow-y-auto pb-1">{list.map(x=><button key={x.id} onClick={()=>setSel(x.id)} className={'shrink-0 text-left rounded-xl border px-3 py-2 min-w-[8.5rem] '+(x.id===p.id?'bg-teal-700 border-teal-700 text-white':'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800')}>
<div className="font-semibold text-sm">{x.bed||'Cama'} <span className="font-normal opacity-80">{x.ini}</span></div>
<div className="flex flex-wrap gap-1 mt-1">{flags(x).map(([t,c])=><span key={t} className={'text-[10px] leading-4 px-1.5 rounded text-white '+c}>{t}</span>)}</div></button>)}
{list.length===0&&<span className="text-sm text-slate-500 px-2">Sin resultados.</span>}
{pts.length<40&&<button onClick={add} className="shrink-0 rounded-xl border border-dashed border-slate-400 px-3 py-2 flex items-center gap-1 text-sm"><Ic d={P.plus}/>Cama ({pts.length}/40)</button>}</nav>
<div className="lg:hidden grid grid-cols-2 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-700 text-sm">{[['form','Formulario'],['prev','Vista previa']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={'py-2 '+(tab===k?'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900':'')}>{l}</button>)}</div>
<div className="grid lg:grid-cols-2 gap-4 items-start">
<div className={tab==='form'?'':'hidden lg:block'}><Form p={p} up={up} sm={m=>{setMode(m)}}/><div className="mt-3 flex flex-wrap gap-4"><button onClick={dup} className="text-sm underline">Duplicar como plantilla (sin identidad ni alergias)</button><button onClick={del} className="text-sm text-red-600 flex items-center gap-1"><Ic d={P.trash}/>Quitar esta cama</button></div></div>
<div className={'lg:sticky lg:top-3 space-y-2 '+(tab==='prev'?'':'hidden lg:block')}>
<div className="grid grid-cols-4 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-700 text-xs sm:text-sm">{MODES.map(([k,l])=><button key={k} onClick={()=>setMode(k)} className={'py-2 '+(mode===k?'bg-teal-700 text-white':'bg-white dark:bg-slate-900')}>{l}</button>)}</div>
<label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={sh} onChange={e=>setSh(e.target.checked)}/>Versión corta para copiar a mano <span className="text-xs text-slate-500 ml-auto">{txt.split('\n').length} líneas, {txt.length} caracteres{full?' ('+Math.round(100-txt.length/full.length*100)+'% menos)':''}</span></label>
<div className="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 max-h-[60vh] overflow-auto text-sm"><pre>{txt}</pre></div>
<button onClick={()=>copy(txt,'prev')} className="w-full py-4 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-lg font-bold flex items-center justify-center gap-2"><Ic c="w-6 h-6" d={copied==='prev'?P.ok:P.copy}/>{copied==='prev'?'Copiado':'Copiar para Ficha Clinica'}</button>
<div className="grid grid-cols-2 gap-2"><button onClick={()=>exp('pdf',txt,'registro-'+(p.bed||'cama'))} className="py-2 rounded-lg border border-slate-400 text-sm">Descargar PDF</button><button onClick={()=>exp('docx',txt,'registro-'+(p.bed||'cama'))} className="py-2 rounded-lg border border-slate-400 text-sm">Descargar Word</button></div>
<p className="text-xs text-slate-500">Texto plano sin emojis ni símbolos especiales. Sin RUT ni nombre; los datos viven solo en este dispositivo.</p></div></div></>}
{acc.one&&<div className="fixed bottom-0 inset-x-0 z-20 grid grid-cols-4 gap-1 p-2 bg-white dark:bg-slate-900 border-t border-slate-300 dark:border-slate-700" style={{paddingBottom:'calc(0.5rem + env(safe-area-inset-bottom,0px))'}}>{[['pac','Pacientes'],['board','Tablero'],['tools','Más']].map(([k,l])=><button key={k} onClick={()=>setView(k)} className={'py-3 rounded-lg text-sm font-semibold '+(view===k?'bg-teal-700 text-white':'border border-slate-400')}>{l}</button>)}<button onClick={()=>copy(view==='board'?turnoTxt(pts,sh):txt,'bar')} className="py-3 rounded-lg bg-teal-700 text-white text-sm font-semibold">{copied==='bar'?'Copiado':'Copiar'}</button></div>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
